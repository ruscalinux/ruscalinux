# ---------------------------------------------------------------------------
# RuscaLinux — single source of truth.
#
# This is the ONLY file where the version is written. It propagates to the
# ISO name, the ISO volume label, /etc/os-release, /etc/issue, the Debian
# Installer title and the GTK installer banner.
#
# To prepare a new version: change VERSION, run ./build.sh, test the image,
# run ./release.sh. That is the whole procedure.
# ---------------------------------------------------------------------------

VERSION="1.99.3"

# --- Debian base ------------------------------------------------------------
SUITE="trixie"
ARCH="amd64"
MIRROR="http://ftp.fr.debian.org/debian/"

KERNEL="6.12"
DESKTOP="GNOME 48"

# --- Bundled packages -------------------------------------------------------
# Version of the icon, wallpaper and font packages built from branding/.
BRANDING_VERSION="1.0"

# --- Strumenti di sistema ---------------------------------------------------
# Le utility in tools/ (RuscaCleaner, RuscaHub, RuscaMark) sono costruite qui,
# non scaricate: dalla 1.99.2 RuscaWriter e vendor/ non ci sono piu'.
# Ognuna ha la sua versione scritta nel proprio make-deb.sh e, come
# APP_VERSION, nel programma: deve coincidere con VERSION qui sopra.
# make-debs.sh avvisa se non coincide. Aggiungerne una e' solo creare una
# directory: make-debs.sh e build.sh le trovano da sole.

# --- Driver NVIDIA (steps/40-nvidia.sh, docs/NVIDIA.md) --------------------
# La ISO contiene il driver dal repository ufficiale NVIDIA per Debian 13,
# con i moduli del kernel aperti. Si avvia e si installa con i driver liberi;
# il driver NVIDIA si sceglie con le voci "... with NVIDIA driver" del menu.
# Il repository debian13 parte dal ramo 590: solo GPU Turing e successive
# (GTX 16, RTX 20/30/40/50).
#
# NVIDIA_PIN e' il suffisso del pacchetto nvidia-driver-pinning-*. RuscaLinux
# segue il ramo ("620"): ogni build prende l'ultima versione del ramo, con le
# sue correzioni. build.sh stampa la versione installata: prima di pubblicare
# si controlla che sia quella provata su hardware vero. Una versione esatta
# ("620.70.06") fissa il driver, se un giorno servisse.
NVIDIA_PIN="620"
NVIDIA_REPO="https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/"

# Componente CUDA del driver (pacchetto nvidia-driver-cuda): nvidia-smi e cio'
# che serve ai programmi CUDA/OpenCL (Blender, DaVinci Resolve...). Non e' il
# CUDA Toolkit. "no" la esclude e rende la ISO piu' piccola: la build stampa
# quanto pesa ("Componente CUDA: ...").
NVIDIA_CUDA="si"
